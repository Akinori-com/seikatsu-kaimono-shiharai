<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おかいものれんしゅう</title>
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100vh;
    margin: 0;
    padding: 8px;
    font-family: "Hiragino Maru Gothic Pro", "Meiryo UI", "Yu Gothic", sans-serif;
    background-color: #f0f7ff;
    color: #222;
    user-select: none;
    -webkit-user-select: none;
  }

  /* アプリ基本構造 */
  .app-container {
    display: flex;
    flex-direction: column;
    height: 100%;
    gap: 8px;
  }

  /* ① ヘッダーコントロール */
  .header-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #ffffff;
    padding: 8px 14px;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    border: 2px solid #d0e3ff;
    flex-shrink: 0;
    gap: 8px;
    flex-wrap: wrap;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: bold;
    color: #333;
  }
  select {
    font-size: 16px;
    font-weight: bold;
    padding: 6px 10px;
    border-radius: 8px;
    border: 2px solid #64b5f6;
    background-color: #fff;
    cursor: pointer;
    outline: none;
  }

  /* ② メインコンテンツエリア */
  .main-content {
    display: flex;
    flex: 1;
    gap: 10px;
    min-height: 0;
  }

  /* ========================================================
     🖼️ 【よこがめん】(左右2カラム・1画面フィット)
     ======================================================== */
  .main-content.layout-landscape {
    flex-direction: row !important;
    overflow: hidden !important;
  }
  .main-content.layout-landscape .left-panel {
    width: 320px !important;
    flex-shrink: 0 !important;
    display: flex;
    flex-direction: column;
    gap: 8px;
    justify-content: space-between;
  }
  .main-content.layout-landscape .right-panel {
    flex: 1 !important;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .main-content.layout-landscape .shop-card {
    flex-direction: column !important;
    padding: 10px;
  }
  .main-content.layout-landscape #item-name {
    font-size: 30px !important;
  }
  .main-content.layout-landscape #item-price {
    font-size: 26px !important;
  }
  .main-content.layout-landscape #item-price-box {
    width: 100% !important;
  }
  .main-content.layout-landscape .coin-100 { width: 64px !important; height: 64px !important; }
  .main-content.layout-landscape .coin-10 { width: 60px !important; height: 60px !important; }
  .main-content.layout-landscape .coin-1 { width: 54px !important; height: 54px !important; }

  /* ========================================================
     📱 【たてがめん】(上下1カラム・縦持ち用)
     ======================================================== */
  .main-content.layout-portrait {
    flex-direction: column !important;
    overflow-y: auto !important; /* 縦長コンテンツをスクロール表示可能に */
    padding-right: 4px;
  }
  .main-content.layout-portrait .left-panel {
    width: 100% !important;
    flex-shrink: 0 !important;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .main-content.layout-portrait .shop-card {
    flex-direction: row !important;
    justify-content: space-around !important;
    padding: 8px 12px !important;
  }
  .main-content.layout-portrait #item-name {
    font-size: 26px !important;
  }
  .main-content.layout-portrait #item-price {
    font-size: 24px !important;
  }
  .main-content.layout-portrait #item-price-box {
    width: auto !important;
  }
  .main-content.layout-portrait .right-panel {
    width: 100% !important;
    flex: none !important;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .main-content.layout-portrait .area-box {
    min-height: 160px !important;
  }
  .main-content.layout-portrait .coin-100 { width: 56px !important; height: 56px !important; }
  .main-content.layout-portrait .coin-10 { width: 52px !important; height: 52px !important; }
  .main-content.layout-portrait .coin-1 { width: 46px !important; height: 46px !important; }

  /* 商品カード基本構造 */
  .shop-card {
    background: linear-gradient(135deg, #ffffff 0%, #fff0f3 100%);
    border: 3px solid #ff8fa3;
    border-radius: 16px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 3px 8px rgba(255, 143, 163, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  #item-name {
    font-weight: bold;
    color: #222;
    line-height: 1.2;
  }
  #item-price-box {
    background: #ffe3e8;
    border: 2px dashed #ff4d6d;
    padding: 4px 12px;
    border-radius: 10px;
  }
  #item-price {
    font-weight: 900;
    color: #d90429;
  }

  /* アクション＆判定カード */
  .action-card {
    background: #ffffff;
    border: 3px solid #d0e3ff;
    border-radius: 16px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex: 1;
    box-shadow: 0 3px 8px rgba(0,0,0,0.04);
  }

  #message {
    font-size: 20px;
    font-weight: 900;
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.3;
  }

  /* おつり表示 */
  .change-result-box {
    display: none;
    background: #fff8e1;
    border: 2px solid #ffb300;
    border-radius: 12px;
    padding: 6px 10px;
    width: 100%;
    text-align: center;
    box-shadow: 0 2px 6px rgba(255, 179, 0, 0.2);
    animation: popIn 0.3s ease-out;
  }
  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .change-title {
    font-size: 15px;
    font-weight: bold;
    color: #b78103;
  }
  .change-amount {
    font-size: 26px;
    font-weight: 900;
    color: #e65100;
  }

  /* ボタン群 */
  .button-container {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 100%;
  }

  .btn-pay {
    background: linear-gradient(180deg, #ff7043 0%, #f4511e 100%);
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 10px 18px;
    width: 100%;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 0 #bf360c, 0 4px 8px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: all 0.1s ease;
  }
  .btn-pay:active {
    box-shadow: 0 0 0 #bf360c, 0 2px 4px rgba(0,0,0,0.15);
    transform: translateY(4px);
  }

  .btn-retry {
    background: linear-gradient(180deg, #ffca28 0%, #ffa000 100%);
    color: #333;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 14px;
    width: 100%;
    border: none;
    border-radius: 10px;
    box-shadow: 0 3px 0 #c77800;
    cursor: pointer;
    display: none;
  }
  .btn-retry:active {
    box-shadow: 0 0 0 #c77800;
    transform: translateY(3px);
  }

  .btn-next {
    background: linear-gradient(180deg, #66bb6a 0%, #43a047 100%);
    color: white;
    font-size: 22px;
    font-weight: bold;
    padding: 10px 18px;
    width: 100%;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 0 #1b5e20, 0 4px 8px rgba(0,0,0,0.15);
    cursor: pointer;
    display: none;
  }
  .btn-next:active {
    box-shadow: 0 0 0 #1b5e20, 0 2px 4px rgba(0,0,0,0.15);
    transform: translateY(4px);
  }

  /* エリアボックス基本 */
  .area-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    padding: 8px 12px;
    min-height: 0;
  }

  .tray-box {
    background: #eafaf1;
    border: 3px dashed #52be80;
  }
  .wallet-box {
    background: #fef9e7;
    border: 3px solid #f5b041;
  }

  .area-header {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .badge {
    background: #27ae60;
    color: white;
    padding: 2px 10px;
    border-radius: 14px;
    font-size: 16px;
  }

  .tray-container-display {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    padding: 2px;
  }
  .denom-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: rgba(255, 255, 255, 0.65);
    padding: 4px 8px;
    border-radius: 10px;
    border: 1px solid #c8e6c9;
  }
  .denom-label {
    font-size: 13px;
    font-weight: bold;
    color: #2e7d32;
  }
  .coin-row-5 {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
  }

  .coins-display {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: flex-start;
    gap: 8px;
    overflow-y: auto;
    padding: 2px;
  }

  /* 硬貨デザイン */
  .coin {
    border-radius: 50%;
    cursor: pointer;
    filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
    transition: transform 0.1s ease;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    flex-shrink: 0;
  }
  .coin:active {
    transform: scale(0.9);
  }

  .coin-100 {
    background-image: url('coin100.png');
  }
  .coin-10 {
    background-image: url('coin10.png');
  }
  .coin-1 {
    background-image: url('coin1.png');
  }
</style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <div class="header-controls">
      <div class="control-group">
        <span>もーど:</span>
        <select id="mode-select" onchange="startNewProblem()">
          <option value="1">① ぴったりはらおう</option>
          <option value="2">② おつりをすくなくはらおう</option>
        </select>
      </div>

      <div class="control-group">
        <span>れべる:</span>
        <select id="level-select" onchange="startNewProblem()">
          <option value="1">れべる 1</option>
          <option value="2">れべる 2</option>
          <option value="3">れべる 3</option>
          <option value="4">れべる 4</option>
          <option value="5">れべる 5</option>
        </select>
      </div>

      <div class="control-group">
        <span>がめん:</span>
        <select id="layout-select" onchange="applyLayout()">
          <option value="landscape">↔️ よこがめん (左右)</option>
          <option value="portrait">↕️ たてがめん (上下)</option>
        </select>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="main-content layout-landscape" id="main-content">
      
      <!-- 左パネル -->
      <div class="left-panel">
        <div class="shop-card">
          <div id="item-name">🍎 りんご</div>
          <div id="item-price-box">
            <span id="item-price">ねだん: -- えん</span>
          </div>
        </div>

        <div class="action-card">
          <div id="message"></div>

          <!-- おつり表示 -->
          <div class="change-result-box" id="change-result-box">
            <div class="change-title">🪙 おつり</div>
            <div class="change-amount" id="change-amount">0 えん</div>
          </div>

          <div class="button-container">
            <button class="btn-pay" id="btn-pay" onclick="checkPayment()">これではらう</button>
            <button class="btn-retry" id="btn-retry" onclick="resetPaymentForRetry()">🔄 もういちど チャレンジ</button>
            <button class="btn-next" id="btn-next" onclick="startNewProblem()">つぎへ ➔</button>
          </div>
        </div>
      </div>

      <!-- 右パネル -->
      <div class="right-panel">
        <!-- はらうおかね -->
        <div class="area-box tray-box">
          <div class="area-header">
            <span>🛒 はらうおかね</span>
            <span class="badge" id="tray-total">0 えん</span>
          </div>
          <div class="tray-container-display" id="tray"></div>
        </div>

        <!-- おさいふ -->
        <div class="area-box wallet-box">
          <div class="area-header">
            <span>👛 おさいふ</span>
          </div>
          <div class="coins-display" id="wallet"></div>
        </div>
      </div>

    </div>
  </div>

<script>
  let currentPrice = 0;
  let targetPayment = 0;
  let trayCoinsList = [];   
  let walletCoinsList = []; 
  let coinIdCounter = 0;

  const items = [
    { name: '🍎 りんご' },
    { name: '🍌 バナナ' },
    { name: '🍊 みかん' },
    { name: '🍰 ケーキ' },
    { name: '🍩 ドーナツ' },
    { name: '🧃 ジュース' },
    { name: '🍦 あいす' },
    { name: '✏️ えんぴつ' },
    { name: '📓 のーと' },
    { name: '🍞 ぱん' },
    { name: '🍙 おにぎり' },
    { name: '🚗 おもちゃ' }
  ];
  
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  const audioCtx = new AudioContext();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(880.00, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'good') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.4);
    } else {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.3);
    }
  }

  function getRand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  // 画面レイアウトの適用関数
  function applyLayout() {
    const layout = document.getElementById('layout-select').value;
    const mainContent = document.getElementById('main-content');

    if (layout === 'portrait') {
      mainContent.classList.remove('layout-landscape');
      mainContent.classList.add('layout-portrait');
    } else {
      mainContent.classList.remove('layout-portrait');
      mainContent.classList.add('layout-landscape');
    }
  }

  function startNewProblem() {
    const mode = document.getElementById('mode-select').value;
    const level = parseInt(document.getElementById('level-select').value);
    
    let coins = [];

    const item = items[getRand(0, items.length - 1)];
    document.getElementById('item-name').textContent = item.name;
    
    if (mode === "1") {
      let num100 = 0, num10 = 0, num1 = 0;
      
      switch(level) {
        case 1:
          num100 = getRand(1, 9);
          currentPrice = num100 * 100;
          break;
        case 2:
          num10 = getRand(1, 9);
          currentPrice = num10 * 10;
          break;
        case 3:
          num10 = getRand(1, 9);
          num1 = getRand(1, 9);
          currentPrice = (num10 * 10) + num1;
          break;
        case 4:
          num100 = getRand(1, 9);
          num10 = getRand(1, 9);
          currentPrice = (num100 * 100) + (num10 * 10);
          break;
        case 5:
          num100 = getRand(1, 9);
          num10 = getRand(1, 9);
          num1 = getRand(1, 9);
          currentPrice = (num100 * 100) + (num10 * 10) + num1;
          break;
      }
      targetPayment = currentPrice;
      
      for(let i=0; i < num100 + getRand(0,3); i++) if(level === 1 || level >= 4) coins.push(100);
      for(let i=0; i < num10 + getRand(0,3); i++) if(level >= 2) coins.push(10);
      for(let i=0; i < num1 + getRand(0,4); i++) if(level === 3 || level === 5) coins.push(1);

    } else {
      switch(level) {
        case 1: {
          currentPrice = getRand(1, 9) * 10;
          targetPayment = 100;
          const num100 = getRand(1, 3);
          for (let i = 0; i < num100; i++) coins.push(100);
          break;
        }
        case 2: {
          const h = getRand(1, 9);
          const t = getRand(1, 9);
          currentPrice = h * 100 + t * 10;
          targetPayment = Math.ceil(currentPrice / 100) * 100;
          const needed100 = targetPayment / 100;
          const num100 = needed100 + getRand(0, 2);
          for (let i = 0; i < num100; i++) coins.push(100);
          break;
        }
        case 3: {
          const t = getRand(1, 9);
          const o = getRand(1, 9);
          currentPrice = t * 10 + o;
          targetPayment = Math.ceil(currentPrice / 10) * 10;
          const needed10 = targetPayment / 10;
          const num10 = needed10 + getRand(0, 3);
          for (let i = 0; i < num10; i++) coins.push(10);
          break;
        }
        case 4: {
          const h = getRand(1, 9);
          const t = getRand(0, 9);
          const o = getRand(1, 9);
          currentPrice = h * 100 + t * 10 + o;
          targetPayment = Math.ceil(currentPrice / 10) * 10;
          
          const needed100 = Math.floor(targetPayment / 100);
          const needed10 = Math.round((targetPayment % 100) / 10);
          
          const num100 = needed100 + getRand(0, 2);
          const num10 = needed10 + getRand(0, 2);
          
          for (let i = 0; i < num100; i++) coins.push(100);
          for (let i = 0; i < num10; i++) coins.push(10);
          break;
        }
        case 5: {
          const h = getRand(1, 9);
          const t = getRand(0, 8);
          const o = getRand(2, 9);
          currentPrice = h * 100 + t * 10 + o;
          targetPayment = Math.ceil(currentPrice / 10) * 10;
          
          const needed100 = Math.floor(targetPayment / 100);
          const needed10 = Math.round((targetPayment % 100) / 10);
          
          const num100 = needed100 + getRand(0, 2);
          const num10 = needed10 + getRand(0, 2);
          const num1 = getRand(0, o - 1);
          
          for (let i = 0; i < num100; i++) coins.push(100);
          for (let i = 0; i < num10; i++) coins.push(10);
          for (let i = 0; i < num1; i++) coins.push(1);
          break;
        }
      }
    }

    document.getElementById('item-price').textContent = `ねだん: ${currentPrice} えん`;
    document.getElementById('tray-total').textContent = `0 えん`;
    document.getElementById('message').textContent = '';
    document.getElementById('change-result-box').style.display = 'none';
    document.getElementById('btn-pay').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
    
    trayCoinsList = [];
    coins.sort(() => Math.random() - 0.5);
    walletCoinsList = coins.map(val => ({ id: ++coinIdCounter, value: val }));

    renderUI();
    applyLayout();
  }

  function renderUI() {
    renderWallet();
    renderTray();
    updateTrayTotal();
  }

  function renderWallet() {
    const walletEl = document.getElementById('wallet');
    walletEl.innerHTML = '';
    
    walletCoinsList.forEach(coinObj => {
      const coin = document.createElement('div');
      coin.className = `coin coin-${coinObj.value}`;
      coin.onclick = () => moveToTray(coinObj.id);
      walletEl.appendChild(coin);
    });
  }

  function renderTray() {
    const trayEl = document.getElementById('tray');
    trayEl.innerHTML = '';

    const denominations = [100, 10, 1];
    
    denominations.forEach(denom => {
      const groupCoins = trayCoinsList.filter(c => c.value === denom);
      if (groupCoins.length === 0) return;

      const groupDiv = document.createElement('div');
      groupDiv.className = 'denom-group';

      const label = document.createElement('div');
      label.className = 'denom-label';
      label.textContent = `${denom}えん玉 (${groupCoins.length}まい)`;
      groupDiv.appendChild(label);

      for (let i = 0; i < groupCoins.length; i += 5) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'coin-row-5';
        
        const chunk = groupCoins.slice(i, i + 5);
        chunk.forEach(coinObj => {
          const coin = document.createElement('div');
          coin.className = `coin coin-${coinObj.value}`;
          coin.onclick = () => moveToWallet(coinObj.id);
          rowDiv.appendChild(coin);
        });
        groupDiv.appendChild(rowDiv);
      }

      trayEl.appendChild(groupDiv);
    });
  }

  function moveToTray(coinId) {
    const index = walletCoinsList.findIndex(c => c.id === coinId);
    if (index !== -1) {
      const [coinObj] = walletCoinsList.splice(index, 1);
      trayCoinsList.push(coinObj);
      renderUI();
    }
  }

  function moveToWallet(coinId) {
    const index = trayCoinsList.findIndex(c => c.id === coinId);
    if (index !== -1) {
      const [coinObj] = trayCoinsList.splice(index, 1);
      walletCoinsList.push(coinObj);
      renderUI();
    }
  }

  function updateTrayTotal() {
    let total = trayCoinsList.reduce((sum, c) => sum + c.value, 0);
    document.getElementById('tray-total').textContent = `${total} えん`;
    document.getElementById('message').textContent = '';
    document.getElementById('change-result-box').style.display = 'none';
    document.getElementById('btn-pay').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
  }

  function resetPaymentForRetry() {
    document.getElementById('message').textContent = '';
    document.getElementById('change-result-box').style.display = 'none';
    document.getElementById('btn-pay').style.display = 'inline-block';
    document.getElementById('btn-retry').style.display = 'none';
    document.getElementById('btn-next').style.display = 'none';
  }

  function checkPayment() {
    let total = trayCoinsList.reduce((sum, c) => sum + c.value, 0);
    const mode = document.getElementById('mode-select').value;

    if (total < currentPrice) {
      playSound('wrong');
      showMessage('たりないよ！', '#d32f2f');
      document.getElementById('change-result-box').style.display = 'none';
    } else if (total === targetPayment) {
      playSound('correct');
      const successMsg = (mode === "1") ? '🎉 ぴったり！' : '🎉 じょうずにできたね！';
      showMessage(successMsg, '#2e7d32');

      if (mode === "2") {
        const change = total - currentPrice;
        document.getElementById('change-amount').textContent = `${change} えn`;
        document.getElementById('change-result-box').style.display = 'block';
      } else {
        document.getElementById('change-result-box').style.display = 'none';
      }

      document.getElementById('btn-pay').style.display = 'none';
      document.getElementById('btn-retry').style.display = 'none';
      document.getElementById('btn-next').style.display = 'inline-block';

    } else if (mode === "2" && total > targetPayment && total >= currentPrice) {
      playSound('good');
      showMessage('⭕ かいものは できるよ！<br><span style="font-size:16px; color:#d97706;">でも、もっと おつりを すくなくできるよ？</span>', '#2563eb');

      const change = total - currentPrice;
      document.getElementById('change-amount').textContent = `${change} えん`;
      document.getElementById('change-result-box').style.display = 'block';

      document.getElementById('btn-pay').style.display = 'none';
      document.getElementById('btn-retry').style.display = 'inline-block';
      document.getElementById('btn-next').style.display = 'inline-block';

    } else {
      playSound('wrong');
      showMessage('おおいよ！', '#d32f2f');
      document.getElementById('change-result-box').style.display = 'none';
    }
  }

  function showMessage(msgHtml, color) {
    const msgEl = document.getElementById('message');
    msgEl.innerHTML = msgHtml;
    msgEl.style.color = color;
  }

  window.onload = () => {
    // 画面幅が小さい場合（768px未満）の初期選択を「たて」に設定
    if (window.innerWidth < 768) {
      document.getElementById('layout-select').value = 'portrait';
    } else {
      document.getElementById('layout-select').value = 'landscape';
    }
    startNewProblem();
  };
</script>
</body>
</html>
